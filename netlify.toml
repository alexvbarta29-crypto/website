# Netlify deploy config — the HTML is pre-generated and committed, so the
# build step only packages the served files into _deploy/ (never the repo's
# build/, docs/, or config/ internals), and Netlify publishes that artifact.

[build]
  command = "python3 build/make_deploy.py"
  publish = "_deploy"

# Old-path canonicalization is handled explicitly by the generated _redirects
# file; keep Netlify's pretty-URL rewriting off so it can't compete with it.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
