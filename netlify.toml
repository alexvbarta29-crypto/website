# Netlify deploy config — the HTML is pre-generated and committed, so the
# build step only packages the served files into _deploy/ (never the repo's
# build/, docs/, or config/ internals), and Netlify publishes that artifact.

[build]
  command = "python3 build/make_deploy.py"
  publish = "_deploy"

# Serverless functions: the /api/lead form-to-Rotor forwarder and the
# customer referral program (/api/referral, /api/referral/admin — see
# docs/REFERRAL-PROGRAM.md). Secrets (ROTOR_API_KEY, REFERRAL_ADMIN_KEY,
# Twilio) are NOT in the repo — set them in the Netlify dashboard under
# Site configuration → Environment variables. esbuild bundles the shared
# netlify/lib/ modules and the @netlify/blobs dependency into each function.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old-path canonicalization is handled explicitly by the generated _redirects
# file; keep Netlify's pretty-URL rewriting off so it can't compete with it.
[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
