name: Sync Instagram Feed

# Pulls the latest posts and live stories from Instagram for the homepage
# carousel and commits the refreshed images/manifest/HTML back to the branch.
# Netlify, which hosts the live site, publishes that push like any other.
#
# Stories disappear from the Instagram API 24 hours after they're posted, so
# besides the daily run there are three story checks a day (every 6 hours in
# all). A story check only rebuilds and commits when the posts or stories
# actually changed, so it doesn't trigger a deploy for nothing; the daily
# run always rebuilds (it also refreshes the Christmas countdown).
on:
  schedule:
    - cron: "0 13 * * *" # daily, ~8am Central
    - cron: "0 1,7,19 * * *" # story checks
  workflow_dispatch: {}

permissions:
  contents: write

# Never two syncs at once (a manual run overlapping a scheduled one).
concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/barta-window-washing-site-f51v9x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Sync Instagram posts and stories
        id: sync
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python3 build/instagram_sync.py

      # On a story check, stop here unless a post or story is new or gone.
      - name: Check for new posts or stories
        id: changed
        run: |
          if [ "${{ github.event.schedule }}" != "0 1,7,19 * * *" ] \
             || [ -n "$(git status --porcelain -- build/instagram_feed.json build/instagram_stories.json)" ]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new posts or stories."
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild site
        if: steps.changed.outputs.rebuild == 'true'
        run: python3 build/build.py

      - name: Commit and push changes
        id: commit
        if: steps.changed.outputs.rebuild == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync Instagram feed [automated]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Optional: only runs if you've added a GH_PAT secret (a personal
      # access token scoped to just this repo's Secrets: write permission).
      # Without it, the refreshed 60-day token from this run is simply not
      # saved back — INSTAGRAM_ACCESS_TOKEN will need a manual refresh
      # before it expires. See docs/INSTAGRAM-SETUP.md.
      - name: Save refreshed token
        if: steps.sync.outputs.refreshed_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set INSTAGRAM_ACCESS_TOKEN --body "${{ steps.sync.outputs.refreshed_token }}"
            echo "Token refreshed and saved."
          else
            echo "GH_PAT not set — skipping automatic token save. See docs/INSTAGRAM-SETUP.md."
          fi
