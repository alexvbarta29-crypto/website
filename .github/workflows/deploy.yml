name: Deploy site to GitHub Pages

# Publishes the static site to GitHub Pages on every push to the
# main development branch. The site is served from the repo root.
on:
  push:
    branches:
      - claude/barta-window-washing-site-f51v9x
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Regenerate pages (ensures HTML matches source)
        run: python3 build/build.py

      # Uploading the whole repo shipped ~145 MB per deploy — mostly
      # unreferenced full-size photo originals — and publicly served
      # internal files (docs/, build/, config/, READMEs). _deploy/ holds
      # only the site pages plus the assets they actually reference.
      - name: Assemble deploy artifact
        run: |
          python3 build/make_deploy.py
          du -sh _deploy

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
